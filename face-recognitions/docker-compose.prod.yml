services:
  face-engine:
    build: .
    env_file: .env.prod
    environment:
      ENV: production
      FACE_DEBUG: "false"
      FACE_HOST: 0.0.0.0
      FACE_PORT: "9000"
      FACE_CORS_ORIGINS: ${FACE_CORS_ORIGINS}
    volumes:
      - face-data:/app/data
      - insightface-models:/root/.insightface
    restart: unless-stopped
    networks: [face-net]
    # no ports: — only reachable via nginx

  nginx:
    image: nginx:1.27-alpine
    depends_on: [face-engine]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ./deploy/nginx/docker-entrypoint.sh:/docker-entrypoint-face.sh:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint-face.sh"]
    restart: unless-stopped
    networks: [face-net]

  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    restart: unless-stopped
    networks: [face-net]

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    environment:
      TZ: UTC
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN}
      TOKEN: ${DUCKDNS_TOKEN}
      UPDATE_IP: ipv4
      LOG_FILE: "false"
    restart: unless-stopped
    # no need to be on face-net; default bridge is fine
    networks: [face-net]

networks:
  face-net:
    driver: bridge

volumes:
  face-data:
  insightface-models:
  certbot-www:
  certbot-conf:
