services:
  face-engine:
    build: .
    # Explicit list only: .env.prod also holds DUCKDNS_TOKEN, which must not reach this container.
    environment:
      ENV: production
      FACE_DEBUG: "false"
      FACE_HOST: 0.0.0.0
      FACE_PORT: "9000"
      FACE_API_KEY: ${FACE_API_KEY:?set FACE_API_KEY in .env.prod}
      FACE_CORS_ORIGINS: ${FACE_CORS_ORIGINS}
      FACE_MAX_UPLOAD_MB: ${FACE_MAX_UPLOAD_MB:-8}
      FACE_RATE_LIMIT: ${FACE_RATE_LIMIT:-60 per minute}
      FACE_VERIFY_THRESHOLD: ${FACE_VERIFY_THRESHOLD:-0.45}
      FACE_IDENTIFY_THRESHOLD: ${FACE_IDENTIFY_THRESHOLD:-0.40}
      FACE_LIVENESS_THRESHOLD: ${FACE_LIVENESS_THRESHOLD:-0.55}
      FACE_REQUIRE_LIVENESS_VERIFY: ${FACE_REQUIRE_LIVENESS_VERIFY:-true}
      FACE_REQUIRE_LIVENESS_IDENTIFY: ${FACE_REQUIRE_LIVENESS_IDENTIFY:-false}
      FACE_MIN_ENROLL_SAMPLES: ${FACE_MIN_ENROLL_SAMPLES:-3}
      FACE_MAX_ENROLL_SAMPLES: ${FACE_MAX_ENROLL_SAMPLES:-5}
      FACE_MIN_FACE_SIZE: ${FACE_MIN_FACE_SIZE:-80}
      FACE_MIN_SHARPNESS: ${FACE_MIN_SHARPNESS:-35}
      FACE_INSIGHTFACE_MODEL: ${FACE_INSIGHTFACE_MODEL:-buffalo_s}
      FACE_DET_SIZE: ${FACE_DET_SIZE:-640}
    volumes:
      - face-data:/app/data
      - insightface-models:/root/.insightface
    restart: unless-stopped
    networks: [face-net]
    # no ports: — only reachable via nginx

  nginx:
    image: nginx:1.27-alpine
    depends_on: [face-engine]
    ports:
      # Behind host nginx (option 2): HTTP_PORT=84 HTTPS_PORT unused when FORCE_HTTP=1
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN}
      FORCE_HTTP: ${FORCE_HTTP:-0}
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ./deploy/nginx/docker-entrypoint.sh:/docker-entrypoint-face.sh:ro
      # Bind mounts so host nginx can read the same Let's Encrypt files
      - ./data/certbot-www:/var/www/certbot:ro
      - ./data/letsencrypt:/etc/letsencrypt:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint-face.sh"]
    restart: unless-stopped
    networks: [face-net]

  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - ./data/certbot-www:/var/www/certbot
      - ./data/letsencrypt:/etc/letsencrypt
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    restart: unless-stopped
    networks: [face-net]

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    environment:
      TZ: UTC
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN}
      TOKEN: ${DUCKDNS_TOKEN}
      UPDATE_IP: ipv4
      LOG_FILE: "false"
    restart: unless-stopped
    networks: [face-net]

networks:
  face-net:
    driver: bridge

volumes:
  face-data:
  insightface-models:
